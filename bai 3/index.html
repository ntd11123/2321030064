<html>
    <head>
        <title>Bài 3</title>
    </head>
    <body>
        <!-- ol danh sách có thứ tự -->
         <ol>
            <li>c#</li>
            <li>python </li>
            <li>java</li>
         </ol>
        <!-- ul danh sách không có thứ tự -->
         <ul>
            <li>c#</li>
            <li>python </li>
            <li>java</li>
         </ul>
        

        <h1>Form đăng ký</h1>
        <form>
            <div>
                <b>Họ và tên:</b><br>
                <!-- nếu input k có type thì sẽ-->
                <!-- mặc định là text-->
                 <!-- thuộc tính readonly sử dụng khi -->
                 <!-- không muốn người dùng nhập -->
                 <!-- thông tin vào input-->
                <input type="text" placeholder="Họ và tên">
            </div>
            <div>
                <b>Mật khẩu</b><br>
                <input type="password" placeholder="Mật khẩu ">
            </div>
            <div>
                <b>Giới thiệu về bản thân </b><br>
                <textarea> Nhập thông tin...</textarea>
            </div>
            <div>
                <b>Email</b><br>
                <input type="email" placeholder="Email">
            </div>
            <div>
                <!-- số đầu tiên 0-->
                <!-- số thứ 2: 3,9,8-->
                <!-- 8 số còn lại: 0-9 -->
                <b>số điện thoại</b><br>
                <input type="tel" 
                pattern="([0]{1} ([3,8,9]{2}))([0-9]{8})">
            </div>
            <div>
                <b>Giới tính</b><br>
                <input type="radio" name="gioitinh" value="nam">Nam<br>
                <input type="radio" name="gioitinh" value="nu">Nữ
            </div>
            <div>
                <b>sở thích</b><br>
                Chơi game<input type="checkbox" name="sở thích" value="choigame"><br>
                Nghe nhạc<input type="checkbox" name="sở thích" value="Nghenhac"><br>
                Thể thao<input type="checkbox" name="sở thích" value="thethao"><br>
            </div>
            <div>
                <b>Trình duyệt web</b>
                <select name="browsers">
                    <option value="chrome">Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="edge">Edge</option>
                    <option value="safari">Safari</option>
                    <option value="opera">Opera</option>
                    <option value="cốc cốc">Cốc Cốc</option>
                    <option value="internet explorer">Internet Explorer</option>
                </select>
            </div>
            <!--0 <input type="range"id="a" value="50"> 100-->
            <div>
                <b>Năm sinh</b>
                <input type="number" placeholder="năm sinh">
            </div>
            <div>
                <input type="submit">
                <button>Xác nhận</button>
                <input type="reset">
            </div>
            
            
        </form>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/5wGTplq6y88?si=CJSMj1oRYlrhJNEm" title="YouTube video player"
        ></iframe>
        <video controls  width="560" height="315">
            <source src="/anh/video.mp4" type="video/mp4">
        </video>
        <audio controls>
            <source src="your-audio-file.mp3" type="audio/mpeg">
        </audio>
        <marquee>
            <img src="/anh/anh al.jpg"> 
        </marquee>
    </body>
</html>
