<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Style</title>
        <style>
            .khoi-1{color:blue;
            background-color:yellow;}
            .khoi-2{color:red;
            background-color:green;
            /* margin truyền 1 giá trị thì sẽ cách xung quanh= giá trị đó*/
            /*2 giá trị: giá đầu (trên dưới) giá trị 2 (trái phải) */
            /*4 giá trị: trên, phải, dưới, trái*/ 
            margin: 10px 50px 100px 280px;
        }    
            .khoi-3{color:green;
            background-color:red;}  
        </style>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h3>cách 2 Internal style</h3>
        <h3 class="khoi-1">Khối 1</h3>
        <h3 class="khoi-2">Khối 2</h3>
        <h3 class="khoi-3">Khối 3</h3>
    </body>
</html>
