<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 9 - JS</title>
    <style>
        .khoi{
            text-align: center;
        }
        img{
            width: 20% ;
        }
    </style>
</head>
<body>
    <div class="khoi">
        <h1>chế độ sáng</h1>
        <img src="./bai9 -javascript/mattroi.jpg" alt "">
        <div>
            <button onclick="doiCheDo()">Đổi chế độ </button>
        </div>
    </div>
    <script>
        //true:sáng/false: tối
        var cheDoHienTai = true;
        function doiCheDo(){
            if (cheDoHienTai == true){
                document.getElementsByTagName("body")[0].style = "background-color:black";
                document.getElementsByTagName("h1")[0].innerHTML = "Chế Độ Tối";
                document.getElementsByTagName("h1")[0].style = "color: white";
                document.getElementsByTagName("img")[0].src = "./bai9 -javascript/mattrang.jpg";
                cheDoHienTai = false;
            }
            else{
                document.getElementsByTagName("body")[0].style = "background-color:white";
                document.getElementsByTagName("h1")[0].innerHTML = "Chế Độ Sáng";
                document.getElementsByTagName("h1")[0].style = "color: black";
                document.getElementsByTagName("img")[0].src = "./bai9 -javascript/mattroi.jpg";
                cheDoHienTai = true;

            }
        }
    </script>
    
</body>
</html>
